# Immich docker-compose — VE1実機で稼働確認済み (2026-08-04)
#
# 構成 (docs/ve1-immich-build.md 参照):
#   - 写真/動画実体 (UPLOAD_LOCATION) → NFSマウント /mnt/nfs/pic_tank (VE2 TrueNAS: tank/pic_tank)
#   - Postgresデータ (DB_DATA_LOCATION) → SSD (ssd-thin切り出し) の**サブディレクトリ** (例: /mnt/ssd-pgdata/postgres)
#     ⚠️ マウントポイント直下は不可。ext4の lost+found が非空判定されinitdbが失敗する (2026-08-04実測)
#   - immich-machine-learning → GTX1650をnvidia-container-toolkit経由で共有 (Frigateとの共存はplan/04-gpu-ai.md)
#
# イメージ参照(redis/database)は公式 https://github.com/immich-app/immich の
# docker/docker-compose.yml (2026-08-04時点) から取得した値。バージョンは変わりうるので
# 導入時に公式の最新版と差分がないか確認すること。

name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped
    shm_size: 128mb

volumes:
  model-cache:
